name: ✨ Feature request
description: Suggest a new feature or an improvement
title: "feat: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! 💡
        tack keeps its public API small on purpose, so please start with the **problem** you're facing — not just the solution. That helps us find the best fit, even if it ends up looking different from what you proposed.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I searched existing issues and discussions for this idea.
          required: true
        - label: I checked the roadmap in the README.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation and why it's hard with tack today.
      placeholder: I need to return a 201 with a Location header after creating a resource, but handlers can only return the body...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work? Show the code you'd want to write.
      render: go
      placeholder: |
        tack.Post(app, "/pets", createPet, tack.Status(201))
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
      description: How do you handle this today, if at all?

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, or how other frameworks (FastAPI, Huma, Fuego, Gin...) solve this.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Routing
        - Binding
        - Validation
        - Errors
        - OpenAPI / docs
        - Middleware / auth
        - TypeScript client
        - File upload / streaming / SSE
        - CLI
        - Documentation / examples
        - Other
    validations:
      required: true

  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on this?
      options:
        - "Yes, I'd like to open a PR"
        - Maybe, with some guidance
        - "No"
    validations:
      required: true
