name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        go: [oldstable, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Test examples/auth
        working-directory: examples/auth
        run: |
          go build ./...
          go vet ./...
          go test -race ./...

  coverage:
    name: Coverage (85% minimum)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - name: Test with coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Enforce threshold
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { sub("%", "", $3); print $3 }')
          echo "Total coverage: ${total}%"
          {
            echo "## Coverage"
            echo
            echo "Total: **${total}%** (minimum 85%)"
            echo
            echo '```'
            go tool cover -func=coverage.out | awk '$3 != "100.0%"' | sort -k3 -n | head -n 25
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          awk -v t="$total" 'BEGIN { exit (t + 0 < 85) }' || { echo "::error::coverage ${total}% is below the 85% minimum"; exit 1; }

  lint:
    name: Lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest

  clients:
    name: Generated clients
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - name: Export petstore spec
        run: |
          go run ./examples/petstore &
          for i in $(seq 60); do curl -sf localhost:8080/openapi.json -o petstore.json && break; sleep 1; done
          test -s petstore.json
      - name: Validate and generate
        run: |
          gen() { docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/w" openapitools/openapi-generator-cli:v7.25.0 "$@"; }
          gen validate -i /w/petstore.json
          gen generate -i /w/petstore.json -g go -o /w/out/go --git-user-id raven-clown --git-repo-id tack-petclient
          gen generate -i /w/petstore.json -g typescript-fetch -o /w/out/ts
      - name: Build Go client
        working-directory: out/go
        run: |
          go mod tidy
          go build ./...

  vulncheck:
    name: Vulnerability check
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        working-directory: examples/auth
